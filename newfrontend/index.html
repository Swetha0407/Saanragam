<!doctype html>
<html lang="ta">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>OlaiLens · ஓலைச்சுவடி சான்றகம்</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500;1,600&family=Noto+Sans+Tamil:wght@400;500;600;700&family=Noto+Serif+Tamil:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <svg id="svg-defs" style="position: absolute; width: 0; height: 0; overflow: hidden; pointer-events: none;" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <filter id="olai-grain" x="0%" y="0%" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.0035 0.55" numOctaves="3" result="grain" />
          <feColorMatrix type="matrix" values="0.22 0 0 0 0.12  0 0.18 0 0 0.08  0 0 0.10 0 0.04  0 0 0 0.18 0" result="coloredGrain" />
          <feBlend in="SourceGraphic" in2="coloredGrain" mode="multiply" />
        </filter>
        <filter id="ragged-edge">
          <feTurbulence type="fractalNoise" baseFrequency="0.04 0.15" numOctaves="2" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <g id="pulli-kolam">
          <circle cx="15" cy="8" r="1.5" class="kolam-dot" />
          <circle cx="45" cy="8" r="1.5" class="kolam-dot" />
          <circle cx="75" cy="8" r="1.5" class="kolam-dot" />
          <circle cx="95" cy="8" r="2.2" class="kolam-bindu" />
          <circle cx="115" cy="8" r="1.5" class="kolam-dot" />
          <circle cx="145" cy="8" r="1.5" class="kolam-dot" />
          <circle cx="175" cy="8" r="1.5" class="kolam-dot" />
          <path d="M 5,8 C 15,2 25,14 35,8 C 45,2 55,14 65,8 C 75,2 85,14 95,8 C 105,2 115,14 125,8 C 135,2 145,14 155,8 C 165,2 175,14 185,8" class="kolam-line" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
        </g>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
